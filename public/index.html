<script>
// ===== CORE: cálculo de estados (sin DOM) =====
const Core = (() => {
  const LINEAS_POR_SESION = 900;

  const s = v => (v === null || v === undefined) ? '' : String(v).trim();
  const normCod = v => s(v).toUpperCase();

  // ---------- Consolidado ----------
  // maestro: Map cod -> {c,d,u,x,co,p,cl}; sesiones: [{id, lineas}]; ajustes: [{id, anulado, creado, lineas:[[cod,contado,sistema,costo,keys]]}]
  function consolidar(maestro, sesiones, ajustes) {
    const consumidas = new Set(), cierre = new Map();
    const ajOrden = ajustes.filter(a => !a.anulado).sort((a, b) => (a.creado < b.creado ? -1 : 1));
    for (const a of ajOrden) for (const l of a.lineas) {
      (l[4] || []).forEach(k => consumidas.add(k));
      cierre.set(l[0], { ajuste: a.id, fecha: a.creado, contado: l[1], sistema: l[2], dif: l[1] - l[2], keys: new Set(l[4] || []) });
    }
    const porItem = new Map();
    const lineasPorItem = new Map();
    for (const se of sesiones) for (const l of (se.lineas || [])) {
      const ref = { ...l, sesion: se.id, origen: se.origen };
      if (!lineasPorItem.has(l.c)) lineasPorItem.set(l.c, []);
      lineasPorItem.get(l.c).push(ref);
      if (l.x || consumidas.has(l.k)) continue;
      let p = porItem.get(l.c);
      if (!p) { p = { q: 0, lineas: [], ubic: new Map(), ult: '' }; porItem.set(l.c, p); }
      p.q += l.q; p.lineas.push(ref);
      p.ubic.set(l.u || '—', (p.ubic.get(l.u || '—') || 0) + l.q);
      if (l.t > p.ult) p.ult = l.t;
    }
    // Ubicaciones y conteos del último cierre vigente de cada artículo
    for (const [c, ci] of cierre) {
      ci.lineas = (lineasPorItem.get(c) || []).filter(l => !l.x && ci.keys.has(l.k));
      ci.ubics = new Map();
      for (const l of ci.lineas) { const u = l.u || '—'; ci.ubics.set(u, (ci.ubics.get(u) || 0) + l.q); }
    }
    // Ítem ya cerrado que se vuelve a contar: una ubicación recontada reemplaza la del cierre,
    // una ubicación nueva se suma, y las que no se recuentan conservan lo contado en el cierre.
    for (const [c, p] of porItem) {
      p.vig = p.lineas.slice();
      const ci = cierre.get(c); if (!ci) continue;
      const abiertas = new Set(p.lineas.map(l => l.u || '—'));
      p.arr = 0; p.arrUbics = []; p.nuevas = [...abiertas].filter(u => !ci.ubics.has(u));
      for (const l of ci.lineas) {
        const u = l.u || '—'; if (abiertas.has(u)) continue;
        p.q += l.q; p.arr += l.q; p.ubic.set(u, (p.ubic.get(u) || 0) + l.q); p.vig.push(l);
        if (!p.arrUbics.includes(u)) p.arrUbics.push(u);
      }
    }
    // Ticket nuevo: una ubicación cuenta como etiquetada si algún conteo vigente ahí lo confirmó
    const etiqueta = vig => {
      if (!vig || !vig.length) return { estado: null, pend: [] };
      const m = new Map();
      for (const l of vig) { const u = l.u || '—'; m.set(u, !!m.get(u) || !!l.et); }
      const pend = [...m].filter(e => !e[1]).map(e => e[0]);
      return { estado: !pend.length ? 'ok' : pend.length === m.size ? 'no' : 'parcial', pend };
    };
    const filas = [];
    const codigos = new Set([...maestro.keys(), ...porItem.keys(), ...cierre.keys()]);
    for (const c of codigos) {
      const m = maestro.get(c) || { c, d: '(no está en el maestro actual)', u: '', x: 0, co: 0, p: 0, cl: '' };
      const ab = porItem.get(c), ci = cierre.get(c);
      let estado = 'pendiente';
      if (ab) estado = 'curso'; else if (ci) estado = 'relevado';
      const ubicCounts = ab ? [...ab.ubic.entries()] : [];

function filtrarItems() {
  const q = S.ui.itQ.trim().toUpperCase(); const F = S.ui.itFiltro;
  let zonaQ = null, toks = [];
  if (q.startsWith('ZONA:')) zonaQ = q.slice(5).trim(); else toks = q.split(/\s+/).filter(Boolean);
  let l = S.filas.filter(f => {
    if (!(PRED[F] || PRED.todos)(f)) return false;
    if (zonaQ !== null && zona(f.u) !== zonaQ) return false;
    if (toks.length) { const h = (f.c + ' ' + f.d + ' ' + f.u + ' ' + f.ubics.map(u => u[0]).join(' ')).toUpperCase(); if (!toks.every(t => h.includes(t))) return false; }
    return true;
  });
  const s = S.ui.itSort;
  const ord = { curso: 0, relevado: 1, pendiente: 2 };
  if (s === 'auto') l.sort((a, b) => ord[a.estado] - ord[b.estado] || Math.abs((b.dif || 0) * b.co) - Math.abs((a.dif || 0) * a.co) || a.c.localeCompare(b.c, 'es', { numeric: true }));
  else if (s === 'cod') l.sort((a, b) => a.c.localeCompare(b.c, 'es', { numeric: true }));
  else if (s === 'valor') l.sort((a, b) => b.x * b.co - a.x * a.co);
  else if (s === 'dif') l.sort((a, b) => (a.dif ?? 1e15) * a.co - (b.dif ?? 1e15) * b.co);
  else if (s === 'ult') l.sort((a, b) => (b.ult || '').localeCompare(a.ult || ''));
  return l;
}

const deltaCache = new Map();
async function historialExistencias(cod) {
  const imps = S.importaciones.filter(i => i.tipo === 'existencias').sort((a, b) => a.creado < b.creado ? -1 : 1);
  const out = [];
  for (const imp of imps) {
    if (imp.base) { const v = (imp.baseVal || {})[cod]; out.push({ fecha: imp.fechaDato, txt: 'Base inicial', x: null, imp }); continue; }
    if (!deltaCache.has(imp.id)) {
      try { const q = await api('delta', undefined, '&id=' + encodeURIComponent(imp.id)); deltaCache.set(imp.id, new Map(q.rows.map(r => [r[0], r]))); } catch (e) { deltaCache.set(imp.id, new Map()); }
    }
    const r = deltaCache.get(imp.id).get(cod); if (r) out.push({ fecha: imp.fechaDato, antes: r[1], despues: r[2], imp });
  }

}

function buscarCarga(raw) {
  const q = raw.trim(); S.carga.q = q; S.carga.item = null; S.carga.cands = []; S.carga.bar = '';
  if (!q) { renderResultado(); return; }
  const Q = Core.normCod(q);
  let cod = null, via = '';
  if (S.maestro.has(Q)) { cod = Q; via = 'artículo'; }
  else if (S.maestro.has('3/' + Q)) { cod = '3/' + Q; via = 'artículo'; }
  else {
    const e = S.equiv.get(q.replace(/\s+/g, ''));
    if (e && e.cods.size === 1) { cod = [...e.cods.keys()][0]; via = 'código impreso conocido'; S.carga.bar = e.b; }
  }
  if (cod) { S.carga.item = { c: cod, via }; renderResultado(); return; }

  const esBarra = /^[0-9A-Z]{6,}$/i.test(q) && !q.includes('/');
  if (esBarra) S.carga.bar = q.replace(/\s+/g, '');

  for (const it of S.maestro.values()) {
    if (out.length > 60) break;
    const n = Core.numeroArticulo(it.c);
    if (esBarra && n.length >= 5 && Q.includes(n.toUpperCase())) { out.push({ c: it.c, why: 'el código impreso contiene el n° de artículo' }); continue; }

}

// Conciliación por artículo: Foto actual = Foto 0 + ajustes cargados + movimientos del sistema.
// Todo se valoriza al costo medio actual para que el puente cierre exacto.
function conciliacion() {
  const f0 = S.foto0Meta; if (!f0) return null;
  const lotes = S.ajustes.filter(a => !a.anulado && a.creado >= f0.marcado);
  const aj = new Map();
  for (const a of lotes) for (const l of a.lineas) { let o = aj.get(l[0]); if (!o) { o = { carg: 0, pend: 0 }; aj.set(l[0], o); } o[a.cargado ? 'carg' : 'pend'] += l[1] - l[2]; }
  const cods = new Set([...S.foto0.keys(), ...S.maestro.keys(), ...aj.keys()]);
  const rows = [], T = { v0: 0, va: 0, falt: 0, sobr: 0, mov: 0, pendF: 0, pendS: 0, base: 0, baseV: 0, cov: 0, covV: 0, sinCargar: lotes.filter(a => !a.cargado).length };
  for (const c of cods) {
    const a0 = S.foto0.get(c), m = S.maestro.get(c), f = S.porCod.get(c) || {}, o = aj.get(c) || { carg: 0, pend: 0 };
    const x0 = a0 ? a0.x : 0, xa = m ? m.x : 0, co = (m && m.co) || (a0 && a0.co) || 0;
    if (!x0 && !xa && !o.carg && !o.pend) continue;
    const mov = xa - x0 - o.carg;
    const rel = f.contado != null ? f.contado : f.cierre ? f.cierre.contado : null;
    rows.push({ c, d: (m && m.d) || (a0 && a0.d) || '', x0, xa, co, carg: o.carg, pend: o.pend, mov, rel, f });
    T.v0 += x0 * co; T.va += xa * co; T.mov += mov * co;
    if (o.carg < 0) T.falt += o.carg * co; else T.sobr += o.carg * co;
    if (o.pend < 0) T.pendF += o.pend * co; else T.pendS += o.pend * co;
    if (x0 > 0) { T.base++; T.baseV += x0 * co; if (f.estado && f.estado !== 'pendiente') { T.cov++; T.covV += x0 * co; } }
  }
  return { rows, T };
}
function cascada(T) {
  const pasos = [
    { n: 'Foto 0', v: T.v0, tot: true, col: 'var(--ink)' },
    { n: 'Faltantes', v: T.falt, col: 'var(--bad)' },
    { n: 'Sobrantes', v: T.sobr, col: 'var(--info)' },
    { n: 'Movimientos', v: T.mov, col: 'var(--gold)' },
    { n: 'Foto actual', v: T.va, tot: true, col: 'var(--ink)' }];
  let acc = 0;
  const bars = pasos.map(p => { const a = p.tot ? 0 : acc, b = p.tot ? p.v : acc + p.v; acc = b; return { ...p, lo: Math.min(a, b), hi: Math.max(a, b), fin: b }; });
  const max = Math.max(1, ...bars.map(b => b.hi)), min = Math.min(0, ...bars.map(b => b.lo));
  const W = 640, H = 250, top = 28, bot = 36, bw = W / bars.length;
  const y = v => top + (max - v) / (max - min || 1) * (H - top - bot);
  let g = `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--line)"/>`;
  bars.forEach((b, i) => {
    const x = i * bw + bw * .18, w = bw * .64, yt = y(b.hi), h = Math.max(1.5, y(b.lo) - yt);
    g += `<rect x="${x}" y="${yt}" width="${w}" height="${h}" rx="2" style="fill:${b.col};opacity:${b.tot ? .82 : 1}"/>`;
    g += `<text x="${x + w / 2}" y="${yt - 7}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${b.tot ? f$(b.v) : (b.v > 0 ? '+' : '') + f$(b.v).replace('$ -', '−$ ')}</text>`;
    g += `<text x="${x + w / 2}" y="${H - 12}" text-anchor="middle" style="fill:var(--muted)">${b.n}</text>`;
    if (i < bars.length - 1) g += `<line x1="${x + w}" x2="${(i + 1) * bw + bw * .18}" y1="${y(b.fin)}" y2="${y(b.fin)}" style="stroke:var(--muted);stroke-dasharray:3 3"/>`;
  });
  return `<svg class="cascada" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puente de valor entre la foto 0 y la foto actual">${g}</svg>`;
}

    <div class="chips">${[['todas', 'Todas'], ['conf', 'Conflictos'], ['rev', 'A revisar']].map(([k, t]) => `<button class="chip" data-f="${k}" aria-pressed="${F === k}">${t}</button>`).join('')}</div>
    <button class="btn" id="eqexp">Exportar a Excel</button></div>
  <p class="small muted" style="margin:0">"A revisar" marca etiquetas cuyo código no incluye el número del artículo. En repuestos Fiat suele coincidir, así que puede ser un error de tipeo o un reemplazo. Corregilo anulando el conteo y cargándolo de nuevo.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Código impreso</th><th>Artículo</th><th>Descripción</th><th class="n">Veces</th><th>Primera vez</th><th>Última vez</th><th></th></tr></thead><tbody>
  ${vis.slice(0, 800).map(e => `<tr><td class="cod">${esc(e.b)}${e.ticket ? ' <span class="pill p-rel">ticket nuevo</span>' : ''}</td><td>${e.codsL.map(c => `<button class="link mono" data-c="${esc(c)}">${esc(c)}</button>`).join('<br>')}</td><td>${e.codsL.map(c => esc((S.maestro.get(c) || {}).d || '')).join('<br>')}</td><td class="n">${e.veces}</td><td class="mono">${esc(fF(e.primera))}</td><td class="mono">${esc(fF(e.ultima))}</td><td>${e.conflicto ? '<span class="pill p-bad">Conflicto</span>' : e.sinNum ? '<span class="pill p-curso">Revisar</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Sin equivalencias con ese filtro</td></tr>'}
  </tbody></table></div>`;
  let deb; $('#eqq', sec).oninput = e => { clearTimeout(deb); deb = setTimeout(() => { S.ui.eqQ = e.target.value; renderKeepFocus('#eqq'); }, 220); };
  sec.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.ui.eqFiltro = b.dataset.f; render(true); });
  sec.querySelectorAll('button[data-c]').forEach(b => b.onclick = () => abrirItem(b.dataset.c));
  $('#eqexp', sec).onclick = () => exportar('codigos_impresos_' + ahora().slice(0, 10) + '.xlsx', [['Código impreso', 'Artículo', 'Descripción', 'Veces', 'Primera vez', 'Última vez', 'Observación']].concat(vis.flatMap(e => e.codsL.map(c => [e.b, c, (S.maestro.get(c) || {}).d || '', e.cods.get(c), e.primera, e.ultima, e.conflicto ? 'Conflicto' : e.sinNum ? 'Revisar' : '']))), 'Equivalencias');
}

// ================== Vista: Historial ==================
function eventos() {
  const ev = [];
  for (const i of S.importaciones) {
    if (i.tipo === 'existencias') ev.push({ t: i.creado, tipo: 'imp', ico: 'EX', txt: `Actualizó existencias del sistema al ${fF(i.fechaDato)}`, det: `${i.archivo || ''} · ${nf0.format(i.total || 0)} artículos${i.base ? ' · base inicial' : ` · ${nf0.format(i.cambios || 0)} con cambios de existencia, ${nf0.format(i.nuevos || 0)} nuevos, ${nf0.format(i.bajas || 0)} dados de baja`}`, u: i.user });
    else ev.push({ t: i.creado, tipo: 'imp', ico: 'RV', txt: `Leyó conteos de la planilla`, det: `${i.nuevas} líneas nuevas · ${i.bajas || 0} quitadas · ${i.rechazadas} rechazadas`, u: i.user });
  }
  for (const s of S.sesiones) {
    const ls = s.lineas || [];
    if (s.origen === 'app') ev.push({ t: s.creado, tipo: 'cnt', ico: 'CT', txt: `Sesión de conteo en la app${s.responsable ? ' · ' + s.responsable : ''}`, det: `${ls.filter(l => !l.x).length} líneas · ubicaciones ${[...new Set(ls.map(l => l.u))].slice(0, 8).join(', ')} · última ${fF(s.actualizado)}`, u: s.user });
    for (const l of ls) if (l.x) ev.push({ t: l.xt, tipo: 'an', ico: 'AN', txt: `Anuló un conteo de ${l.c}`, det: `${fN(l.q)} u. en ${l.u} del ${fF(l.t)}`, u: l.xu });
  }
  if (S.foto0Meta) { const f0 = S.foto0Meta; ev.push({ t: f0.marcado, tipo: 'imp', ico: 'F0', txt: 'Guardó la foto 0 del relevamiento', det: `existencias al ${fF(f0.fechaDato)} · ${nf0.format(f0.total || 0)} artículos · ${f$(f0.valor)}`, u: f0.user }); }
  for (const a of S.ajustes) {
    if (a.cargado) ev.push({ t: a.cargadoEl, tipo: 'aj', ico: 'OK', txt: `Marcó como cargado en el sistema el lote del ${fF(a.creado)}`, det: `${a.lineas.length} ítems${a.nota ? ' · ' + a.nota : ''}`, u: a.cargadoPor });
    ev.push({ t: a.creado, tipo: 'aj', ico: 'AJ', txt: `Cerró ${a.lineas.length} ítems en un lote de ajuste${a.nota ? ' · ' + a.nota : ''}`, det: `${a.lineas.filter(l => l[1] - l[2]).length} con diferencia · existencias al ${fF(a.fechaSistema)}`, u: a.user });
    if (a.anulado) ev.push({ t: a.anuladoEl, tipo: 'an', ico: 'AN', txt: `Anuló el lote de ajuste del ${fF(a.creado)}`, det: `${a.lineas.length} ítems volvieron a En curso`, u: a.anuladoPor });
  }
  return ev.filter(e => e.t).sort((a, b) => b.t.localeCompare(a.t));
}
function evHtml(e) { return `<div class="ev"><div class="when">${esc(fF(e.t))}</div><div class="ico ${e.tipo}">${e.ico}</div><div><div>${esc(e.txt)}</div><div class="small muted">${esc(e.det)}${e.u ? ' · ' + esc(nombre(e.u)) : ''}</div></div></div>`; }
function vHistorial(sec) {
  const F = S.ui.hiFiltro; const all = eventos(); const l = all.filter(e => F === 'todos' || e.tipo === F);
  sec.innerHTML = `<div><h2>Historial</h2><p class="lead">Todo lo que pasó en el relevamiento: importaciones, sesiones de conteo, cierres y anulaciones. Nada se borra; las correcciones quedan registradas como anulaciones.</p></div>
  <div class="chips">${[['todos', 'Todo'], ['imp', 'Importaciones'], ['cnt', 'Conteos'], ['aj', 'Cierres'], ['an', 'Anulaciones']].map(([k, t]) => `<button class="chip" data-f="${k}" aria-pressed="${F === k}">${t}<span class="n">${k === 'todos' ? all.length : all.filter(e => e.tipo === k).length}</span></button>`).join('')}</div>
  <div class="panel"><div class="timeline">${l.slice(0, S.ui.hiLim).map(evHtml).join('') || '<div class="empty">Sin eventos</div>'}</div>${l.length > S.ui.hiLim ? '<div class="more"><button class="btn" id="himore">Ver más</button></div>' : ''}</div>`;
  sec.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.ui.hiFiltro = b.dataset.f; render(true); });
  const m = $('#himore', sec); if (m) m.onclick = () => { S.ui.hiLim += 200; render(true); };
}

// ================== Vista: Planilla ==================
function vPlanilla(sec) {
  const imps = S.importaciones.slice().sort((a, b) => b.creado.localeCompare(a.creado));
  const ex = S.meta
    ? `<p class="small" style="margin:0">Tomadas de la pestaña <b>${esc(S.meta.archivo || '')}</b> · ${nf0.format(S.meta.total || 0)} artículos · actualizadas el ${esc(fF(S.meta.fechaDato))}.</p><p class="small muted" style="margin:8px 0 0">Para actualizarlas, reemplazá el contenido de esa pestaña. La app lo toma sola.</p>`
    : `<p class="small" style="margin:0">La planilla todavía no tiene existencias. Con ellas se activan faltantes, sobrantes, Cierres y ajustes, y Foto 0.</p>
      <p class="small muted" style="margin:8px 0 0">Para activarlas, agregá a la planilla una pestaña con las columnas <b>Articulo</b>, <b>Descripcion</b>, <b>Ubicacion</b> y <b>Exist.</b> Con <b>Cost.medio</b> y <b>P.V.P.</b> también ves valores en pesos, pero quedan visibles para quien tenga el link. Antes de pegar, poné la columna Articulo en formato de texto: si no, Sheets convierte códigos como 3/07 en fechas.</p>`;
  sec.innerHTML = `<div><h2>Planilla</h2><p class="lead">La app se conecta sola a la planilla de Google: lee los conteos cada 5 minutos y lo que se carga acá se copia a su pestaña App Conteos.</p></div>
  <div class="cols2">
    <div class="drop"><h3>Conteos</h3><div id="ppan"></div></div>
    <div class="drop"><h3>Existencias del sistema</h3>${ex}</div>
  </div>
  <div id="prech"></div>
  <div class="panel"><div class="panel-head"><h3>Lecturas con cambios</h3></div><div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Origen</th><th>Resultado</th></tr></thead><tbody>
  ${imps.map(i => `<tr><td class="mono">${esc(fF(i.creado))}</td><td>${i.tipo === 'existencias' ? 'Existencias' : 'Conteos'}</td><td class="small">${esc(i.archivo || '')}</td><td class="small">${i.tipo === 'existencias' ? `${nf0.format(i.total)} art.${i.base ? ' · base inicial' : ` · ${nf0.format(i.cambios)} cambios`}` : `${i.nuevas} nuevas · ${i.bajas || 0} quitadas · ${i.rechazadas} rechazadas`}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Todavía no hubo lecturas</td></tr>'}
  </tbody></table></div></div>`;
  panelPlanilla();
}

// ================== Panel de la planilla ==================
async function sincronizarAhora() {
  S.sincronizando = true; panelPlanilla();
  try { const r = await api('sincronizar', {}); if (r.limitado) toast('La planilla se leyó hace un momento. Esperá unos segundos.'); await refrescar(); }
  catch (e) { toast(errMsg(e)); }
  finally { S.sincronizando = false; panelPlanilla(); }
}
function panelPlanilla() {
  const el = $('#ppan'); if (!el) return;
  const p = S.planilla || {}, c = S.cola || {};
  const lectura = p.ultima ? `Última lectura: <b>${esc(fF(p.ultima))}</b> · ${nf0.format(p.lineas || 0)} líneas` : 'Todavía no se leyó la planilla.';
  const salida = !c.script ? `<div class="notice warn" style="margin-top:10px">La escritura en la planilla todavía no está conectada. ${c.pendientes ? nf0.format(c.pendientes) + ' conteos esperan en la cola; no se pierden.' : ''}</div>`
    : c.error ? `<div class="notice bad" style="margin-top:10px">No se pudo escribir en la planilla: ${esc(c.error)}. ${nf0.format(c.pendientes)} pendientes; se reintenta solo.</div>`
    : `<p class="small muted" style="margin:8px 0 0">${c.pendientes ? nf0.format(c.pendientes) + ' conteos por copiar a la planilla.' : 'Todo lo cargado en la app ya está en la planilla.'}</p>`;
  el.innerHTML = `<p class="small" style="margin:0">${lectura}</p>
    ${p.ok === false ? `<div class="notice bad" style="margin-top:10px">${esc(p.error || 'No se pudo leer la planilla.')}</div>` : ''}
    ${(p.pestanas || []).length ? `<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Pestaña</th><th class="n">Líneas</th><th class="n">Rechazadas</th></tr></thead><tbody>${p.pestanas.map(t => `<tr><td class="small">${esc(t.nombre)}</td><td class="n">${nf0.format(t.lineas)}</td><td class="n">${nf0.format(t.rechazadas)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${salida}
    <div class="toolbar" style="margin-top:12px"><button class="btn" id="psync" ${S.sincronizando ? 'disabled' : ''}>${S.sincronizando ? 'Leyendo…' : 'Actualizar ahora'}</button></div>`;
  $('#psync').onclick = sincronizarAhora;
  const rec = $('#prech'); if (!rec) return;
  const rs = p.rechazadas || [];
  rec.innerHTML = rs.length ? `<div class="panel"><div class="panel-head"><h3>Líneas de la planilla rechazadas (${nf0.format(p.totalRechazadas || rs.length)})</h3></div><div class="tbl-wrap"><table><thead><tr><th>Pestaña</th><th class="n">Fila</th><th>ID</th><th>Producto</th><th class="n">Cant.</th><th>Motivo</th></tr></thead><tbody>${rs.map(r => `<tr><td class="small">${esc(r.hoja)}</td><td class="n">${r.fila}</td><td class="cod">${esc(r.c)}</td><td>${esc(r.d)}</td><td class="n">${fN(r.q)}</td><td class="small">${esc(r.motivo)}</td></tr>`).join('')}</tbody></table></div></div>` : '';
}

init();
})();
</script>
</body></html>
